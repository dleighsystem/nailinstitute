[pytest]
addopts = --import-mode=importlib
pythonpath =
    arena
    ave
    horizon
    harness-reference/capabilities/text_to_sql/evaluation
    harness-reference/tool_use
    experiments
norecursedirs =
    .git
    .venv
    __pycache__
    harness-reference
    public-repo
markers =
    slow: marks tests as slow or notebook-backed
