[pytest]
addopts = --import-mode=importlib
pythonpath =
    # Package roots (pkg/pkg layout) MUST precede the repo root: directories like
    # ave/ have no __init__.py, so with the root ahead of them `import ave` binds to
    # the bare-directory namespace shadow instead of the real ave/ave package.
    scripts
    arsenal
    nail_harness
    arena
    ave
    horizon
    harness-reference/capabilities/text_to_sql/evaluation
    harness-reference/tool_use
    experiments
    .
testpaths =
    tests
    scripts/tests
norecursedirs =
    .git
    .venv
    __pycache__
    harness-reference
    public-repo
markers =
    slow: marks tests as slow or notebook-backed
