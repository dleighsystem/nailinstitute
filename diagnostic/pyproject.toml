[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nail-diagnostic"
version = "1.0.0"
description = "NAIL Insurance Diagnostic Pipeline — 7-node adversarial stress-test for AI agent rating"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
nail = [
    "nail-ave>=1.0.0",
    "nail-canary>=1.0.0",
    "nail-arena>=1.0.0",
]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
