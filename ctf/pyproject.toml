[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nail-ctf"
version = "1.0.0"
description = "Agentic Capture-The-Flag — Red Team CTF events for AI agent security"
requires-python = ">=3.11"
dependencies = [
    "nail-ave>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
