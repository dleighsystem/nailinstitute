[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nail-ctf"
version = "2.0.0"
description = "Agentic Capture-The-Flag — Red Team CTF events for AI agent security"
requires-python = ">=3.11"
dependencies = [
    "nail-ave>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
all = ["nail-ctf[dev,server]"]

[project.scripts]
ctf = "ctf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
