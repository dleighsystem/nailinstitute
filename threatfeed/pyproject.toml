[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nail-threatfeed"
version = "2.0.0"
description = "Live Threat Intelligence Pipeline — Discover → Publish → Protect"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NAIL Institute", email = "research@neuravant.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
all = ["nail-threatfeed[dev,server]"]

[project.scripts]
threatfeed = "threatfeed.cli:main"

[project.urls]
Homepage = "https://github.com/nailinstitute/threatfeed"
Repository = "https://github.com/nailinstitute/threatfeed"

[tool.pytest.ini_options]
testpaths = ["tests"]
