# ─── NAIL Local LLM Training Configuration ─────────────────────────────
# All training runs locally on the DGX Spark (GB10 / 128GB unified).
# No data, weights, or evaluation results leave this machine.
# ─────────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════
# MODEL DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════

models:
  # ── Small Model: nail-guard ────────────────────────────────────────
  # Fast classifier / router / guardrail judge
  # Runs on every request at <50ms latency
  guard:
    base_model: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"
    output_name: "nail-guard"
    role: "classifier"
    description: >
      Fast model for routing, guardrail judgment, AVE classification,
      tool selection, and drift detection. Sits in the hot path.
    tasks:
      - guardrail_judge       # Is this input/output safe?
      - ave_classifier        # Which AVE category does this match?
      - route_selector        # Which tool/agent should handle this?
      - drift_detector        # Has the agent drifted from task?
      - containment_enforcer  # BEE envelope check (Paper 8)

    training:
      method: "sft"              # Supervised fine-tuning first
      lora:
        r: 32
        alpha: 64
        dropout: 0.05
        target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                         "gate_proj", "up_proj", "down_proj"]
      batch_size: 4
      gradient_accumulation: 8   # effective batch = 32
      learning_rate: 2.0e-4
      epochs: 6                  # R3: bumped 3→6 — format learning needs more passes
      max_seq_length: 2048
      warmup_ratio: 0.05
      scheduler: "cosine"
      bf16: true
      gradient_checkpointing: true

    # Phase 2: DPO alignment after SFT
    alignment:
      method: "dpo"
      learning_rate: 5.0e-5
      beta: 0.1
      epochs: 2                  # R3: bumped 1→2 — format-DPO + content-DPO combined

    export:
      quantization: "q4_k_m"    # 4-bit GGUF for Ollama
      ollama_name: "nail-guard"

  # ── Large Model: nail-reason ───────────────────────────────────────
  # Deep reasoning / analysis / report generation
  # Called only when complex analysis is needed
  reason:
    base_model: "unsloth/Qwen2.5-32B-Instruct-bnb-4bit"
    output_name: "nail-reason"
    role: "reasoner"
    description: >
      Deep analysis model for vulnerability research, attack chain
      reasoning, incident report generation, and code security audit.
      Called selectively — not on every request.
    tasks:
      - vulnerability_analysis  # Deep-dive on AVE findings
      - attack_chain_reasoning  # Multi-step attack path analysis
      - incident_report         # Generate structured incident reports
      - code_audit              # Security code review
      - threat_modeling         # Threat landscape assessment

    training:
      method: "sft"
      lora:
        r: 16                   # Lower rank — 32B model needs less
        alpha: 32
        dropout: 0.05
        target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                         "gate_proj", "up_proj", "down_proj"]
      batch_size: 1
      gradient_accumulation: 16  # effective batch = 16
      learning_rate: 1.0e-4
      epochs: 2
      max_seq_length: 4096
      warmup_ratio: 0.05
      scheduler: "cosine"
      bf16: true
      gradient_checkpointing: true

    # Phase 2: GRPO reinforcement learning
    alignment:
      method: "grpo"
      learning_rate: 1.0e-5
      num_generations: 4
      epochs: 1

    export:
      quantization: "q4_k_m"
      ollama_name: "nail-reason"

# ═══════════════════════════════════════════════════════════════════════
# DATASET CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════

dataset:
  output_dir: "scripts/local_llm/data"
  sources:
    ave_cards: "ave-database/cards/"
    experiments: "experiments/data/"
    experiment_logs: "experiments/logs/"
    attack_library: "diagnostic/diagnostic/attacks.py"
    nail_judge: "experiments/data/nail_judge_finetune_train.jsonl"
    papers: "paper/"
  
  # Synthetic generation — use local Ollama models to expand dataset
  synthesis:
    generator_model: "qwen2.5:32b-instruct"   # Local Ollama model
    temperature: 0.7
    samples_per_card: 10       # 42 cards × 10 = 420 samples
    samples_per_attack: 15     # 21 attacks × 15 = 315 samples
    samples_per_experiment: 5  # ~30 experiments × 5 = 150 samples
    # Target: ~1,200 synthetic + 265 existing = ~1,465 training samples

  # Train/eval split
  eval_fraction: 0.1
  seed: 42

# ═══════════════════════════════════════════════════════════════════════
# IN-HOUSE CERTIFICATION (no data leaves the DGX)
# ═══════════════════════════════════════════════════════════════════════

certification:
  # Standard academic benchmarks (via lm-eval-harness, all local)
  standard_benchmarks:
    - mmlu                  # General knowledge (57 subjects)
    - hellaswag             # Commonsense reasoning
    - arc_challenge         # Science reasoning
    - truthfulqa_mc2        # Truthfulness
    - winogrande            # Coreference resolution
    - gsm8k                 # Math reasoning

  # NAIL custom security evaluation tasks
  nail_security_suite:
    - nail_ave_classification    # Given a description, classify the AVE
    - nail_guardrail_judgment    # Given input+output, is it safe?
    - nail_attack_detection      # Is this input an attack attempt?
    - nail_drift_detection       # Has the agent drifted from task?
    - nail_containment_decision  # What containment action to take?
    - nail_severity_scoring      # Rate severity 1-10 with justification
    - nail_false_positive        # Don't flag benign inputs as attacks
    - nail_multi_turn_tracking   # Track attack across conversation turns

  # Minimum passing scores for deployment
  pass_criteria:
    mmlu: 0.60               # Must not degrade general knowledge
    hellaswag: 0.70
    nail_ave_classification: 0.85   # High bar for security tasks
    nail_guardrail_judgment: 0.90
    nail_attack_detection: 0.85
    nail_false_positive: 0.90       # Must not over-block
    overall_regression: -0.02       # Max 2% drop vs base model

  # Red-team adversarial probing
  red_team:
    num_probes: 200
    attack_categories:
      - prompt_injection
      - jailbreak
      - social_engineering
      - data_exfiltration
      - privilege_escalation
    max_bypass_rate: 0.05    # Must block 95%+ of attacks

# ═══════════════════════════════════════════════════════════════════════
# HARDWARE / RUNTIME
# ═══════════════════════════════════════════════════════════════════════

hardware:
  device: "cuda"           # GB10 via unified memory
  dtype: "bfloat16"
  max_memory_gb: 100       # Leave 28GB for OS + Ollama inference
  use_unsloth: true        # Unsloth kernels for 2x speed
  seed: 42

paths:
  checkpoints: "scripts/local_llm/checkpoints"
  exports: "scripts/local_llm/exports"
  logs: "scripts/local_llm/logs"
  eval_results: "scripts/local_llm/eval_results"
