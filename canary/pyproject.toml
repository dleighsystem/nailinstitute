[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nail-canary"
version = "2.0.0"
description = "Canary Fleet — Agentic honeypots that detect novel zero-day agent attacks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "NAIL Institute", email = "research@neuravant.com"}]

dependencies = [
    "nail-ave>=1.0.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.104", "uvicorn>=0.24", "aiohttp>=3.9"]
discord = ["discord.py>=2.3"]
full = ["fastapi>=0.104", "uvicorn>=0.24", "aiohttp>=3.9", "discord.py>=2.3"]
dev = ["pytest>=7.0", "pytest-cov", "pytest-asyncio"]

[project.scripts]
canary = "canary.cli:main"

[project.urls]
Homepage = "https://github.com/NAIL-INTITUTE-FOR-AGENTIC-SECURITY/ave-database"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
