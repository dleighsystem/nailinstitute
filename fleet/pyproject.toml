[project]
name = "nail-fleet"
version = "0.2.0"
description = "NAIL Fleet — telemetry roll-up across deployed agents."
authors = [{name = "NAIL Institute"}]
requires-python = ">=3.10"
license = {text = "Proprietary"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nail-fleet = "fleet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleet*"]
exclude = ["tests*"]
