[project]
name = "nail-security"
version = "1.0.0"
description = "NAIL Security unified AI agent security layer."
authors = [{name = "NAIL Institute"}]
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nail_security*"]
exclude = ["tests*"]
