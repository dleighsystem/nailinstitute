[project]
name = "nail-security"
version = "1.0.0"
description = "NAIL Security unified AI agent security layer."
authors = [{name = "NAIL Institute"}]
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout: the project root directory *is* the nail_security package (it holds
# __init__.py and the modules directly). Map the package name onto "." so setuptools'
# PEP 660 editable finder can expose `import nail_security` without a src/ move.
[tool.setuptools]
packages = ["nail_security"]

[tool.setuptools.package-dir]
nail_security = "."
