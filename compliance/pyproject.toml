[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nail-compliance"
version = "0.1.0"
description = "Machine-checkable AI/agentic regulatory controls (EU AI Act; UK & US to follow)"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "NAIL Institute", email = "research@neuravant.com"},
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["compliance*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
