[project]
name = "nail-arsenal"
version = "0.1.0"
description = "NAIL Arsenal — capability provisioning. Short-lived, ed25519-signed tool tokens. Agents start with zero capabilities."
authors = [{name = "NAIL Institute"}]
requires-python = ">=3.10"
license = {text = "Proprietary"}
readme = "README.md"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nail-arsenal = "arsenal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arsenal*"]
exclude = ["tests*"]
