name: Package Import Check

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**/pyproject.toml'
  pull_request:
    paths:
      - '**.py'
      - '**/pyproject.toml'

jobs:
  import-check:
    name: Verify all packages import cleanly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all packages
        run: |
          pip install --upgrade pip
          # Install each sub-package in editable mode
          pip install -e ave/
          pip install -e arena/
          pip install -e nail_monitor/
          pip install -e horizon/
          pip install -e canary/
          pip install -e ctf/
          pip install -e diagnostic/
          pip install -e integration/
          pip install -e rmap/
          pip install -e threatfeed/

      - name: Verify imports
        run: |
          python -c "
          import sys
          failed = []

          packages = [
              ('ave', ['AVECard', 'Category', 'Severity', 'compute_avss', 'lookup', 'all_cards']),
              ('nail_arena', ['Arena']),
              ('nail_monitor', ['PathologyMonitor']),
              ('nail_horizon', ['HorizonScanner']),
              ('nail_canary', ['CanaryDeployment']),
              ('nail_ctf', ['CTFEngine']),
              ('nail_diagnostic', None),
              ('nail_integration', None),
              ('rmap', ['RegulatoryMapper']),
              ('nail_threatfeed', None),
          ]

          for pkg_name, expected_attrs in packages:
              try:
                  mod = __import__(pkg_name)
                  if expected_attrs:
                      for attr in expected_attrs:
                          if not hasattr(mod, attr):
                              failed.append(f'{pkg_name}.{attr} — attribute missing')
                  print(f'  ✅ {pkg_name}')
              except Exception as e:
                  failed.append(f'{pkg_name} — {e}')
                  print(f'  ❌ {pkg_name}: {e}')

          if failed:
              print(f'\n::error::{len(failed)} import failures:')
              for f in failed:
                  print(f'  ::error::{f}')
              sys.exit(1)
          else:
              print(f'\nAll {len(packages)} packages import cleanly ✅')
          "

      - name: Verify __all__ exports exist
        run: |
          python -c "
          import sys
          missing = []
          packages = ['ave', 'nail_arena', 'nail_monitor', 'nail_horizon',
                      'nail_canary', 'nail_ctf', 'rmap', 'nail_threatfeed']
          for pkg_name in packages:
              try:
                  mod = __import__(pkg_name)
                  if not hasattr(mod, '__all__'):
                      missing.append(pkg_name)
                      print(f'  ⚠️  {pkg_name} — missing __all__')
                  else:
                      print(f'  ✅ {pkg_name} — __all__ has {len(mod.__all__)} exports')
              except Exception as e:
                  print(f'  ❌ {pkg_name}: {e}')

          if missing:
              print(f'\n::warning::{len(missing)} packages missing __all__: {missing}')
          "

  test-packages:
    name: Run package tests
    runs-on: ubuntu-latest
    needs: import-check

    strategy:
      fail-fast: false
      matrix:
        package:
          - ave
          - arena
          - nail_monitor
          - horizon
          - canary
          - ctf
          - diagnostic
          - integration
          - rmap
          - threatfeed

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e ${{ matrix.package }}/
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd ${{ matrix.package }}
          pytest tests/ -v --tb=short || true
        continue-on-error: true

  docs-code-sync:
    name: Check documentation/code alignment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check package references in README
        run: |
          errors=0

          # Every package mentioned in README should have a pyproject.toml
          for pkg in ave arena nail_monitor horizon canary ctf diagnostic integration rmap threatfeed; do
            if [ ! -f "$pkg/pyproject.toml" ]; then
              echo "::error::Package $pkg referenced but missing pyproject.toml"
              errors=$((errors + 1))
            fi
          done

          # Check that DEBT.md exists
          if [ ! -f "DEBT.md" ]; then
            echo "::warning::DEBT.md not found — technical debt is not being tracked"
          fi

          if [ $errors -gt 0 ]; then
            echo "::error::$errors documentation/code mismatches found"
            exit 1
          fi

          echo "Documentation/code alignment check passed ✅"
