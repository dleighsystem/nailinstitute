name: Package Import Check

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**/pyproject.toml'
  pull_request:
    paths:
      - '**.py'
      - '**/pyproject.toml'

jobs:
  import-check:
    name: Verify all packages import cleanly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all packages
        run: |
          pip install --upgrade pip
          pip install \
            -e rmap/ \
            -e ave/ \
            -e canary/ \
            -e arena/ \
            -e ctf/ \
            -e diagnostic/ \
            -e horizon/ \
            -e integration/ \
            -e threatfeed/ \
            -e nail_monitor/ \
            -e fleet/ \
            -e shield/ \
            -e nail_harness/ \
            -e nail_security/ \
            -e arsenal/

      - name: Verify imports
        # Keep the repo root off sys.path: bare package dirs (canary/, ave/, ...)
        # share their name with the installed package and would shadow it here.
        env:
          PYTHONSAFEPATH: "1"
        run: |
          python -c "
          import sys
          failed = []

          packages = {
              'rmap': [],
              'ave': [],
              'canary': [],
              'arena': [],
              'ctf': [],
              'diagnostic': [],
              'horizon': [],
              'integration': [],
              'threatfeed': [],
              'nail_monitor': ['NailMonitor', 'DEFAULT_PATHOLOGY_REGISTRY'],
              'fleet': [],
              'shield': [],
              'nail_security': ['NailSecurity', 'ThreatLevel'],
          }

          submodules = [
              'rmap.graph',
              'ave.schema',
              'canary.trapwire',
              'arena.arena',
              'ctf.tournament',
              'diagnostic.pipeline',
              'horizon.campaign',
              'integration.pipeline',
              'threatfeed.feed',
              'nail_monitor.detectors_v9',
              'fleet.ingest',
              'shield.pipeline',
              'nail_security.security',
          ]

          for pkg_name, expected_attrs in packages.items():
              try:
                  mod = __import__(pkg_name)
                  for attr in expected_attrs:
                      if not hasattr(mod, attr):
                          failed.append(f'{pkg_name}.{attr} — attribute missing')
                  print(f'  ✅ {pkg_name}')
              except Exception as e:
                  failed.append(f'{pkg_name} — {e}')
                  print(f'  ❌ {pkg_name}: {e}')

          for module_name in submodules:
              try:
                  __import__(module_name)
                  print(f'  ✅ {module_name}')
              except Exception as e:
                  failed.append(f'{module_name} — {e}')
                  print(f'  ❌ {module_name}: {e}')

          if failed:
              print(f'\n::error::{len(failed)} import failures:')
              for f in failed:
                  print(f'  ::error::{f}')
              sys.exit(1)
          else:
              print(f'\nAll imports passed ✅')
          "

  test-packages:
    name: Run package tests
    runs-on: ubuntu-latest
    needs: import-check

    strategy:
      fail-fast: false
      matrix:
        package:
          - ave
          - arena
          - nail_monitor
          - horizon
          - canary
          - ctf
          - diagnostic
          - integration
          - rmap
          - threatfeed
          - nail_monitor
          - fleet
          - shield
          - nail_security
          - scripts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install \
            -e rmap/ \
            -e ave/ \
            -e canary/ \
            -e arena/ \
            -e ctf/ \
            -e diagnostic/ \
            -e horizon/ \
            -e integration/ \
            -e threatfeed/ \
            -e nail_monitor/ \
            -e fleet/ \
            -e shield/ \
            -e nail_harness/ \
            -e nail_security/ \
            -e arsenal/
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd ${{ matrix.package }}
          pytest tests/ -v --tb=short

  docs-code-sync:
    name: Check documentation/code alignment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check package references in README
        run: |
          errors=0

          # Every package mentioned in README should have a pyproject.toml
          for pkg in ave arena nail_monitor horizon canary ctf diagnostic integration rmap threatfeed fleet shield nail_harness nail_security; do
            if [ ! -f "$pkg/pyproject.toml" ]; then
              echo "::error::Package $pkg referenced but missing pyproject.toml"
              errors=$((errors + 1))
            fi
          done

          # Check that DEBT.md exists
          if [ ! -f "DEBT.md" ]; then
            echo "::warning::DEBT.md not found — technical debt is not being tracked"
          fi

          if [ $errors -gt 0 ]; then
            echo "::error::$errors documentation/code mismatches found"
            exit 1
          fi

          echo "Documentation/code alignment check passed ✅"
