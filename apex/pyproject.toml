[project]
name = "nail-apex"
version = "0.1.0"
description = "NAIL Apex — Kahneman dual-system cognitive front-end (System 1 fast / System 2 deliberate) wired into the NAIL safety surface (shield, foresight, fleet)."
authors = [{name = "NAIL Institute"}]
requires-python = ">=3.10"
license = {text = "Proprietary"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
embed   = ["sentence-transformers>=2.2"]
ollama  = ["requests>=2.28"]
shield  = []   # sibling package; resolved at runtime
foresight = []
fleet   = []
test    = ["pytest>=7"]

[project.scripts]
nail-apex = "apex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apex*"]
exclude = ["tests*"]
